name: Temporary scale Morbius Plus hardware

on:
  push:
    paths:
      - .github/workflows/temporary-scale-morbius-plus.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update the Morbius Plus hardware configuration
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/hardware_update.py
          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "/tmp")
          from hardware_update import update_hardware_tree

          root = Path("hw/kernel_morbius_plus")
          update_hardware_tree(root)

          types = (root / "MorbiusTypes.bsv").read_text()
          kernel = (root / "KernelMain.bsv").read_text()
          gibbs = (root / "GibbsPipeline.bsv").read_text()
          assert "typedef 16 NumPipeline;" in types
          assert "typedef 128 NumPE_Profiler;" in types
          assert "typedef 4 NumPE_LPM;" in types
          assert "Bit#(16) protocolVersion = 2;" in kernel
          assert kernel.count("rule receiveBootstrapState") == 16
          assert kernel.count("rule receiveBootstrapBpm") == 16
          assert kernel.count("rule receiveBootstrapLpm") == 16
          assert "Vector#(ResultBeatNum, Reg#(Bit#(512))) resultWordsR" in kernel
          assert "Vector#(128, LogProb) masked" in gibbs
          assert "UInt#(50) product" in gibbs
          PY

      - name: Commit directly to main
        shell: bash
        run: |
          rm -f .github/workflows/temporary-scale-morbius-plus.yml
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add hw/kernel_morbius_plus .github/workflows/temporary-scale-morbius-plus.yml
          git commit -m "Scale Morbius+ to 16 pipelines and 128 profiler PEs"
          git push origin HEAD:main
