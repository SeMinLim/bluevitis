name: Apply Morbius Plus resource optimization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-morbius-resource-optimization.yml'

permissions:
  contents: write

concurrency:
  group: apply-morbius-resource-optimization
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Apply staged source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/payload/part* > /tmp/morbius_payload.b64
          base64 -d /tmp/morbius_payload.b64 > /tmp/morbius_payload.tar.gz
          tar -xzf /tmp/morbius_payload.tar.gz -C .
          rm -f hw/kernel_morbius_plus/PwlLane.bsv

      - name: Install Bluespec compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-ubuntu-24.04.tar.gz \
            -o /tmp/bsc.tar.gz
          mkdir -p /tmp/bsc
          tar -xzf /tmp/bsc.tar.gz -C /tmp/bsc
          BSC_BIN=$(find /tmp/bsc -type f -path '*/bin/bsc' | head -n 1)
          test -n "$BSC_BIN"
          BSC_HOME=$(dirname "$(dirname "$BSC_BIN")")
          VERILOG_DIR=$(find "$BSC_HOME" -type d -path '*/Verilog' | head -n 1)
          test -n "$VERILOG_DIR"
          echo "$(dirname "$BSC_BIN")" >> "$GITHUB_PATH"
          echo "BLUESPECDIR=$(dirname "$VERILOG_DIR")" >> "$GITHUB_ENV"
          "$BSC_BIN" -version

      - name: Validate host model and protocol
        shell: bash
        run: |
          set -euo pipefail
          make -C sw/host_morbius_plus clean
          make -C sw/host_morbius_plus model
          make -C sw/host_morbius_plus test
          rm -rf /tmp/morbius_model_output
          sw/host_morbius_plus/obj/model \
            --input sw/host_morbius_plus/test/DNA_TEST.fasta \
            --output /tmp/morbius_model_output/result \
            --alphabet dna \
            --motif-length 16 \
            --max-updates 16 \
            --score-threshold 1.0 \
            --seed 1 \
            --batch-size 4

      - name: Elaborate universal RTL
        shell: bash
        run: |
          set -euo pipefail
          KERNEL=hw/kernel_morbius_plus
          OBJ=/tmp/morbius_bsc_universal
          mkdir -p "$OBJ/verilog"
          cd "$KERNEL"
          bsc +RTS -K512M -RTS \
            -show-schedule -aggressive-conditions -steps 10000000 \
            -bdir "$OBJ" -vdir "$OBJ/verilog" -simdir "$OBJ" \
            -info-dir "$OBJ" -fdir "$OBJ" \
            -remove-dollar -verilog -u -g kernel KernelTop.bsv
          grep -R -q 'BRAM2' "$OBJ/verilog"
          if grep -R -q 'RegFile #' "$OBJ/verilog"; then
            echo 'Distributed RegFile storage remains in the optimized RTL.'
            exit 1
          fi

      - name: Elaborate DNA-specialized RTL
        shell: bash
        run: |
          set -euo pipefail
          KERNEL=hw/kernel_morbius_plus
          OBJ=/tmp/morbius_bsc_dna
          mkdir -p "$OBJ/verilog"
          cd "$KERNEL"
          bsc +RTS -K512M -RTS \
            -show-schedule -aggressive-conditions -steps 10000000 \
            -D MORBIUS_DNA_ONLY \
            -bdir "$OBJ" -vdir "$OBJ/verilog" -simdir "$OBJ" \
            -info-dir "$OBJ" -fdir "$OBJ" \
            -remove-dollar -verilog -u -g kernel KernelTop.bsv

      - name: Run Bluesim regression
        shell: bash
        run: |
          set -euo pipefail
          KERNEL=hw/kernel_morbius_plus
          OBJ=/tmp/morbius_bluesim
          mkdir -p "$OBJ"
          cd "$KERNEL"
          bsc +RTS -K512M -RTS \
            -show-schedule -aggressive-conditions -steps 10000000 \
            -bdir "$OBJ" -simdir "$OBJ" -info-dir "$OBJ" \
            -u -sim -g mkTestGibbsPipeline TestGibbsPipeline.bsv
          bsc +RTS -K512M -RTS \
            -bdir "$OBJ" -simdir "$OBJ" -info-dir "$OBJ" \
            -sim -e mkTestGibbsPipeline -o "$OBJ/test_gibbs"
          "$OBJ/test_gibbs"

      - name: Commit optimized source directly to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/payload
          rm -f .github/workflows/apply-morbius-resource-optimization.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          make -C sw/host_morbius_plus clean
          git config user.name 'SeMinLim'
          git config user.email 'seminl1@kookmin.ac.kr'
          git add -A
          git commit -m 'Optimize Morbius+ U50 resource architecture'
          git push origin HEAD:main
